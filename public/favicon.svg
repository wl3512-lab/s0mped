<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E1A52"/>
      <stop offset="1" stop-color="#3D2660"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Outer frame top + right -->
  <rect x="8" y="8" width="48" height="8" fill="#C4B5E8"/>
  <rect x="52" y="8" width="8" height="48" fill="#C4B5E8"/>
  <!-- Inner frame bottom-right notch -->
  <rect x="30" y="30" width="8" height="22" fill="#C4B5E8"/>
  <rect x="8" y="52" width="52" height="8" fill="#C4B5E8"/>
  <!-- Left column fill -->
  <rect x="8" y="16" width="22" height="44" fill="#C4B5E8"/>
</svg>
